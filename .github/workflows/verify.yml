name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r test/requirements.txt
      - name: Run unit tests with GCC and Clang
        run: python test/verify.py --unit-only --cxx g++ clang++
      - name: Run ASan and UBSan tests
        run: python test/verify.py --unit-only --cxx clang++ --sanitize
      - name: Run Library Checker tests
        run: oj-verify run --timeout 1200 --tle 10 -j 2
