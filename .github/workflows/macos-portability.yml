name: macOS portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve explicit no-cache event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .verify-helper/no_cache_route.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        if: steps.route.outputs.mode == 'normal'
        id: cache
        with:
          path: .verify-helper/verified-state.json
          key: macos-${{ runner.arch }}-portable-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-${{ runner.arch }}-portable-v1-${{ github.ref }}-
            macos-${{ runner.arch }}-portable-v1-refs/heads/main-
      - name: Select affected headers and unit tests
        if: steps.route.outputs.mode == 'normal'
        run: python .verify-helper/ci.py plan
      - name: Select exact-head affected scope without cache
        if: steps.route.outputs.mode == 'no-cache'
        env:
          VERIFY_AFFECTED_BASE: ${{ steps.route.outputs.base }}
          VERIFY_EXPECTED_HEAD: ${{ steps.route.outputs.head }}
          VERIFY_EXPECTED_REF: ${{ steps.route.outputs.ref }}
        run: python .verify-helper/ci.py plan --affected-base "$VERIFY_AFFECTED_BASE" --expected-head "$VERIFY_EXPECTED_HEAD" --expected-ref "$VERIFY_EXPECTED_REF"
      - name: Select exact-head full scope without cache
        if: steps.route.outputs.mode == 'control-full'
        env:
          VERIFY_EXPECTED_HEAD: ${{ steps.route.outputs.head }}
        run: python .verify-helper/ci.py plan --control-full --expected-head "$VERIFY_EXPECTED_HEAD"
      - name: Check Apple Clang
        run: |
          uname -a
          clang++ --version
          python test/verify.py --unit-only --cxx clang++ --selection .verify-helper/selection.json
          python .verify-helper/ci.py record --groups headers unit
      - uses: actions/cache/save@v4
        if: steps.route.outputs.mode == 'normal'
        with:
          path: .verify-helper/verified-state.json
          key: ${{ steps.cache.outputs.cache-primary-key }}
