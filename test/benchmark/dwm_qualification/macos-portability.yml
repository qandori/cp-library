name: macOS portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select affected headers and unit tests
        run: python .verify-helper/ci.py plan
      - name: Check Apple Clang
        run: |
          uname -a
          clang++ --version
          python test/verify.py --unit-only --cxx clang++ --selection .verify-helper/selection.json
          python .verify-helper/ci.py record --groups headers unit
